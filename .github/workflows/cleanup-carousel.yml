name: Clean unused carousel dependency
on:
  push:
    branches: [design/remove-featured-carousel]
    paths: [.github/workflows/cleanup-carousel.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Remove unused carousel library and build
        working-directory: frontend
        run: |
          npm uninstall embla-carousel-react
          npm run build
      - name: Commit dependency cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --quiet || (git commit -m "chore: remove unused Embla carousel dependency" && git push origin HEAD:design/remove-featured-carousel)
