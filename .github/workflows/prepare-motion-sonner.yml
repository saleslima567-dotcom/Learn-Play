name: Prepare Motion and Sonner dependencies

on:
  push:
    branches:
      - feature/learnplay-motion-sonner
    paths:
      - .github/workflows/prepare-motion-sonner.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and validate build
        run: |
          cd frontend
          npm install motion sonner --save
          npm run build
      - name: Commit lockfile changes to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --quiet || (git commit -m "build: lock Motion and Sonner dependencies" && git push origin HEAD:feature/learnplay-motion-sonner)
