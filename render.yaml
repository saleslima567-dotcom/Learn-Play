# Render Blueprint / YAML / Render / LearnPlay web service + managed PostgreSQL
services:
  - type: web
    name: descomplica-cursos
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: descomplica cursos-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: DEMO_STUDENT_PASSWORD
        sync: false
      - key: DEMO_INSTRUCTOR_PASSWORD
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false

databases:
  - name: descomplica cursos-db
    databaseName: descomplica cursos
    user: descomplica cursos
    plan: free
    postgresMajorVersion: "17"
